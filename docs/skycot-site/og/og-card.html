<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>SKYCOT share card</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fff;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial,
          sans-serif;
        color: #1d1d1f;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 76px 88px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-weight: 700;
        letter-spacing: 0.16em;
        font-size: 30px;
      }
      .brand svg {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 0;
        font-size: 84px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        font-weight: 700;
        max-width: 14ch;
      }
      .sub {
        margin: 18px 0 0;
        font-size: 32px;
        line-height: 1.3;
        color: #6e6e73;
        font-weight: 500;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 26px;
        color: #6e6e73;
      }
      .foot b {
        color: #0071e3;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <svg class="mark" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#0071e3" />
          <circle
            cx="32"
            cy="32"
            r="21"
            fill="none"
            stroke="#fff"
            stroke-width="2.2"
            opacity=".5"
          />
          <circle
            cx="32"
            cy="32"
            r="13"
            fill="none"
            stroke="#fff"
            stroke-width="2.2"
            opacity=".8"
          />
          <circle cx="32" cy="32" r="5" fill="#fff" />
          <path
            d="M17 32h9M38 32h9M32 17v9M32 38v9"
            stroke="#fff"
            stroke-width="2.2"
            stroke-linecap="round"
            opacity=".9"
          /></svg
        ><span>SKYCOT</span>
      </div>
      <div>
        <h1>The family-friendly AI developer.</h1>
        <p class="sub">Kids dream it up. SKYCOT builds it.</p>
      </div>
      <div class="foot"><b>SKYCOT for Mac · early access</b><span>skycot.com</span></div>
    </div>
  </body>
</html>
