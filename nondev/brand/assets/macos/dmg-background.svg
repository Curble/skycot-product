<?xml version="1.0"?>
<!-- SKYCOT installer window (the DMG background). Same 640x432 layout as upstream's
     apps/desktop/resources/dmg/dmg-background-latest.svg: the app icon sits at (166, 214) and the
     Applications link at (474, 214), so the arrow and text keep their places. Rendered to PNG by
     the desktop build with `sips` (seam brand-dmg-background). Clean and light, Apple-style;
     the wordmark is nondev/brand/assets/svg/wordmark.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="864" viewBox="0 0 640 432">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#EAF5FF"/>
      <stop offset=".6" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="640" height="432" fill="url(#sky)"/>
  <svg x="30" y="24" width="60" height="22" viewBox="0 0 316 116">
    <g fill="none" stroke="#2B2420" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(6 0)" d="M31 48C28 42.5 23 40 17 40C9 40 4 44.5 4 51C4 57.5 9.5 60.5 17 62.5C25 64.5 31 67.5 31 75C31 83 25 90 16.5 90C10 90 4.5 87.5 2 83"/>
      <path transform="translate(56 0)" d="M4 8V90M33 42L5 69M15 59L35 90"/>
      <path transform="translate(103 0)" d="M1 42L20 86M39 42L20 90C17 99 12 106 3 106"/>
      <path transform="translate(154 0)" d="M46.6 52.5A25 25 0 1 0 46.6 77.5"/>
      <circle cx="237" cy="65" r="25"/>
      <path transform="translate(276 0)" d="M13 14V76C13 86 18 90 26 90H32M1 42H31"/>
    </g>
    <ellipse cx="229.5" cy="64" rx="3.6" ry="5.4" fill="#2B2420"/>
    <ellipse cx="244.5" cy="64" rx="3.6" ry="5.4" fill="#2B2420"/>
  </svg>
  <text x="320" y="104" fill="#1D1D1F" font-family="Helvetica" font-size="23" font-weight="700" text-anchor="middle">Drag SKYCOT into Applications.</text>
  <path d="M270 204Q320 179 370 204M358 190L370 204L351 209" stroke="#0071E3" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="367" fill="#6E6E73" font-family="Helvetica" font-size="12" font-weight="400" text-anchor="middle">Then open SKYCOT from your Applications folder.</text>
</svg>
