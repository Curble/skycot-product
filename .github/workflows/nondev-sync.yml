# nondev fork: nightly merge of upstream T3 Code (pingdotgg/t3code) into this repository.
#
# What it does (see nondev/README.md for the plain-English version):
#   1. checks out `main` with full history, restores the git rerere cache (remembered conflict fixes)
#   2. runs nondev/scripts/upstream-sync.ts, which creates sync/upstream-YYYY-MM-DD, merges
#      upstream/main, resolves lockfile + declared-seam conflicts mechanically, typechecks and
#      builds @t3tools/nondev, and writes nondev/sync-report.md on the branch
#   3. pushes the branch and opens/updates the PR `sync: upstream YYYY-MM-DD` with the report as body
#   4. optionally enables GitHub auto-merge (only when repo variable NONDEV_SYNC_AUTOMERGE=true and
#      the sync was clean; branch protection must require the `nondev / check` status for this to wait
#      for CI instead of merging immediately)
#
# Secrets / variables (Settings → Secrets and variables → Actions):
#   NONDEV_SYNC_TOKEN      optional PAT (contents + pull-requests write). Without it the default
#                          GITHUB_TOKEN is used: PRs it creates do NOT trigger nondev-ci.yml, so
#                          auto-merge cannot go green. Also requires "Allow GitHub Actions to create
#                          and approve pull requests" in Settings → Actions → General.
#   NONDEV_SYNC_AUTOMERGE  repo variable; set to `true` to let clean syncs merge themselves.
name: nondev / upstream sync

on:
  schedule:
    # 16:00 UTC = 03:00 Melbourne during daylight saving (AEDT, Oct–Apr) and 02:00 during
    # standard time (AEST, Apr–Oct). GitHub cron has no time-zone support.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch to merge (default: main)"
        default: "main"
        type: string
      dry_run:
        description: "Only report what would be merged; create no branch or PR"
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nondev-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.NONDEV_SYNC_TOKEN || github.token }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
    steps:
      # Full history: the script needs the merge-base with upstream, and rerere needs .git.
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.NONDEV_SYNC_TOKEN || github.token }}

      - name: Restore remembered conflict resolutions (git rerere)
        uses: actions/cache/restore@v6
        with:
          path: .git/rr-cache
          key: nondev-rerere-${{ github.run_id }}
          restore-keys: |
            nondev-rerere-

      - name: Setup Vite+ and install dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Configure git identity
        run: |
          git config user.name "nondev-sync[bot]"
          git config user.email "nondev-sync@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Run upstream sync
        id: sync
        continue-on-error: true
        run: |
          args=(--upstream-ref "$UPSTREAM_REF" --outputs "$GITHUB_OUTPUT")
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          node nondev/scripts/upstream-sync.ts "${args[@]}"

      - name: Publish report to the job summary
        if: always()
        run: |
          echo "status=${{ steps.sync.outputs.status }} branch=${{ steps.sync.outputs.branch }} commits=${{ steps.sync.outputs.commits }}"
          if [ -f nondev/sync-report.md ]; then cat nondev/sync-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report artifact
        if: always() && hashFiles('nondev/sync-report.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: sync-report-${{ steps.sync.outputs.date || github.run_id }}
          path: nondev/sync-report.md
          retention-days: 30

      - name: Stop when there is nothing to merge or this was a dry run
        if: steps.sync.outputs.status == 'up-to-date' || inputs.dry_run == true
        run: echo "Nothing further to do (status=${{ steps.sync.outputs.status }})."

      - name: Fail loudly when the merge was aborted
        if: steps.sync.outputs.status == 'aborted' || steps.sync.outputs.status == ''
        run: |
          echo "::error::Upstream sync aborted: a conflict outside the declared seams needs a human. See the job summary."
          exit 1

      - name: Push sync branch
        if: steps.sync.outputs.status == 'clean' || steps.sync.outputs.status == 'needs-human'
        run: |
          branch="${{ steps.sync.outputs.branch }}"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

      - name: Open or update pull request
        id: pr
        if: steps.sync.outputs.status == 'clean' || steps.sync.outputs.status == 'needs-human'
        run: |
          branch="${{ steps.sync.outputs.branch }}"
          title="sync: upstream ${{ steps.sync.outputs.date }}"
          gh label create upstream-sync --color 0E8A16 --description "Nightly merge of pingdotgg/t3code" --force
          gh label create needs-human --color D93F0B --description "The sync could not finish on its own" --force
          number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            number="$(gh pr create --base main --head "$branch" --title "$title" --body-file nondev/sync-report.md --label upstream-sync | grep -oE '[0-9]+$')"
          else
            gh pr edit "$number" --title "$title" --body-file nondev/sync-report.md --add-label upstream-sync
          fi
          if [ "${{ steps.sync.outputs.status }}" = "needs-human" ]; then
            gh pr edit "$number" --add-label needs-human
          else
            gh pr edit "$number" --remove-label needs-human 2>/dev/null || true
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Pull request #$number: $(gh pr view "$number" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

      # Only when explicitly enabled. GitHub's auto-merge waits for the branch's required status
      # checks; if `main` has no protection rule requiring `nondev / check`, this call errors out
      # (and we surface that) rather than merging an unchecked branch.
      - name: Enable auto-merge for a clean sync
        if: steps.pr.outcome == 'success' && steps.sync.outputs.status == 'clean' && vars.NONDEV_SYNC_AUTOMERGE == 'true'
        run: gh pr merge --auto --merge "${{ steps.pr.outputs.number }}"

      - name: Save remembered conflict resolutions (git rerere)
        if: always() && hashFiles('.git/rr-cache/**') != ''
        uses: actions/cache/save@v6
        with:
          path: .git/rr-cache
          key: nondev-rerere-${{ github.run_id }}

      - name: Report needs-human as a failed run so it is noticed
        if: steps.sync.outputs.status == 'needs-human'
        run: |
          echo "::warning::Sync PR opened but needs a human: ${{ steps.sync.outputs.reasons }}"
          exit 1
