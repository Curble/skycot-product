<!doctype html><meta charset="utf-8" /><title>Classic canvas game</title>
<canvas id="board" width="100" height="100"></canvas><button onclick="jump()">Jump</button>
<output id="result" data-ok="no"></output>
<script>
  var y = 0;
  function jump() {
    y++;
    document.querySelector("#result").dataset.ok = "yes";
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp") jump();
  });
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowUp" }));
</script>
