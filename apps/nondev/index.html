<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fff9ef" />
    <!-- Declared here so the browser never probes /favicon.ico (a 404 on every load). The day
         drawing is the static default; src/features/brand/useDaylightPhase.ts swaps in the dusk
         one from local civil dusk to dawn. Vite fingerprints both files into dist/. -->
    <link rel="icon" type="image/svg+xml" href="./src/assets/brand/favicon-day.svg" />
    <link rel="apple-touch-icon" href="./src/assets/brand/apple-touch-icon-day.png" />
    <script>
      // Paint the right background before React mounts. Reads the same
      // localStorage keys as the stock UI so both clients agree on dark/light;
      // src/app/theme.ts keeps this in sync afterwards. An explicit Appearance
      // choice (the mode key) wins over the stock UI's theme name.
      (() => {
        try {
          const mode = window.localStorage.getItem("t3code:theme-appearance-mode");
          const stored = window.localStorage.getItem("t3code:theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark =
            mode === "dark"
              ? true
              : mode === "light"
                ? false
                : mode === "system"
                  ? prefersDark
                  : stored === "dark"
                    ? true
                    : stored === "light"
                      ? false
                      : prefersDark;
          document.documentElement.classList.toggle("dark", isDark);
          // The active theme's window colour, saved by src/themes/store.ts on every apply.
          let paint = null;
          try {
            paint = JSON.parse(window.localStorage.getItem("skycot:theme:paint") ?? "null");
          } catch {
            paint = null;
          }
          const side = paint && paint[isDark ? "dark" : "light"];
          // No saved colour means a browser that never ran SKYCOT, so it opens in the default
          // look (Workshop, src/themes/defaultTheme.ts); defaultTheme.test.ts keeps these in step.
          const fallback = isDark ? "#241e1a" : "#fff6e6";
          const colour =
            side && /^[#a-zA-Z0-9(),.% ]{3,64}$/.test(String(side.window)) ? side.window : fallback;
          document.documentElement.style.backgroundColor = colour;
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          // Larger text (Settings → Appearance), applied before first paint too.
          if (window.localStorage.getItem("skycot:text") === "large") {
            document.documentElement.setAttribute("data-text", "large");
          }
        } catch {
          // Storage can be blocked; the stylesheet's defaults take over.
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
    <!-- Static fallback only: src/main.tsx sets the title from src/brand.ts. -->
    <title>SKYCOT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
