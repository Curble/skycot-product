<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f6f6f8" />
    <!-- Declared here, not only from src/brand.ts at runtime, so the browser never probes
         /favicon.ico (a 404 on every load). Keep in step with FAVICON_DATA_URI. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23007AFF%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20text-anchor%3D%22middle%22%20font-family%3D%22-apple-system%2C%20Helvetica%2C%20Arial%2C%20sans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%3ES%3C%2Ftext%3E%3C%2Fsvg%3E"
    />
    <script>
      // Paint the right background before React mounts. Reads the same
      // localStorage keys as the stock UI so both clients agree on dark/light;
      // src/app/theme.ts keeps this in sync afterwards. An explicit Appearance
      // choice (the mode key) wins over the stock UI's theme name.
      (() => {
        try {
          const mode = window.localStorage.getItem("t3code:theme-appearance-mode");
          const stored = window.localStorage.getItem("t3code:theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark =
            mode === "dark"
              ? true
              : mode === "light"
                ? false
                : mode === "system"
                  ? prefersDark
                  : stored === "dark"
                    ? true
                    : stored === "light"
                      ? false
                      : prefersDark;
          document.documentElement.classList.toggle("dark", isDark);
          // The active theme's window colour, saved by src/themes/store.ts on every apply.
          let paint = null;
          try {
            paint = JSON.parse(window.localStorage.getItem("skycot:theme:paint") ?? "null");
          } catch {
            paint = null;
          }
          const side = paint && paint[isDark ? "dark" : "light"];
          const fallback = isDark ? "#1e1e1e" : "#f5f5f7";
          const colour =
            side && /^[#a-zA-Z0-9(),.% ]{3,64}$/.test(String(side.window)) ? side.window : fallback;
          document.documentElement.style.backgroundColor = colour;
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch {
          // Storage can be blocked; the stylesheet's defaults take over.
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
    <!-- Static fallback only: src/main.tsx sets the title and favicon from src/brand.ts. -->
    <title>SKYCOT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
